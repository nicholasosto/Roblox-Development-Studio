<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 2048 2048" role="img" aria-labelledby="title desc">
  <title id="title">Measured draft grid for a hexagonal Roblox city center</title>
  <desc id="desc">A 512 by 512 stud top-down X-Z plan with a 160 stud civic core, 12 stud inner sidewalk, 32 stud ring road, 12 stud outer sidewalk, and six 32 stud road approaches.</desc>

  <defs>
    <pattern id="grid-minor" x="128" y="128" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M 14 0 L 0 0 0 14" fill="none" stroke="#1d4356" stroke-width="1"/>
    </pattern>
    <pattern id="grid-major" x="128" y="128" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#347088" stroke-width="1.4"/>
    </pattern>
    <pattern id="grid-super" x="128" y="128" width="224" height="224" patternUnits="userSpaceOnUse">
      <path d="M 224 0 L 0 0 0 224" fill="none" stroke="#64aabc" stroke-width="2"/>
    </pattern>

    <marker id="dimension-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f5d77a"/>
    </marker>
    <marker id="north-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f4f8fa"/>
    </marker>

    <mask id="outside-road" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="-320" y="-320" width="640" height="640">
      <rect x="-320" y="-320" width="640" height="640" fill="white"/>
      <polygon points="143.182867,0 71.591433,124 -71.591433,124 -143.182867,0 -71.591433,-124 71.591433,-124" fill="black"/>
    </mask>
    <mask id="outside-overall" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="-320" y="-320" width="640" height="640">
      <rect x="-320" y="-320" width="640" height="640" fill="white"/>
      <polygon points="157.039273,0 78.519637,136 -78.519637,136 -157.039273,0 -78.519637,-136 78.519637,-136" fill="black"/>
    </mask>

    <g id="crosswalk">
      <rect x="124.5" y="-14" width="1.5" height="28" rx="0.25"/>
      <rect x="127.5" y="-14" width="1.5" height="28" rx="0.25"/>
      <rect x="130.5" y="-14" width="1.5" height="28" rx="0.25"/>
      <rect x="133.5" y="-14" width="1.5" height="28" rx="0.25"/>
    </g>

    <style>
      .ui-text { font-family: Inter, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .boundary { fill: none; stroke: #eef4f4; stroke-opacity: 0.72; stroke-width: 2; vector-effect: non-scaling-stroke; }
      .curb { fill: none; stroke: #f4ead9; stroke-opacity: 0.9; stroke-width: 2.2; vector-effect: non-scaling-stroke; }
      .lane { fill: none; stroke: #f6f4e8; stroke-width: 2.5; stroke-dasharray: 15 12; vector-effect: non-scaling-stroke; }
      .dimension { fill: none; stroke: #f5d77a; stroke-width: 2; vector-effect: non-scaling-stroke; }
      .tick { stroke: #8dc3d1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="2048" height="2048" fill="#061722"/>
  <rect x="128" y="128" width="1792" height="1792" fill="#0a2331"/>
  <rect x="128" y="128" width="1792" height="1792" fill="url(#grid-minor)"/>
  <rect x="128" y="128" width="1792" height="1792" fill="url(#grid-major)"/>
  <rect x="128" y="128" width="1792" height="1792" fill="url(#grid-super)"/>

  <!-- World geometry. The transform makes 3.5 SVG pixels equal one Roblox stud. -->
  <g transform="translate(1024 1024) scale(3.5)">
    <!-- The three full corridors form six 56-stud sidewalk-to-sidewalk approaches. -->
    <g fill="#d7cbb5">
      <rect x="-310" y="-28" width="620" height="56" transform="rotate(30)"/>
      <rect x="-310" y="-28" width="620" height="56" transform="rotate(90)"/>
      <rect x="-310" y="-28" width="620" height="56" transform="rotate(150)"/>
    </g>

    <!-- Concentric regular hexes. Apothem differences are the physical band widths. -->
    <polygon points="157.039273,0 78.519637,136 -78.519637,136 -157.039273,0 -78.519637,-136 78.519637,-136" fill="#d7cbb5"/>
    <polygon points="143.182867,0 71.591433,124 -71.591433,124 -143.182867,0 -71.591433,-124 71.591433,-124" fill="#303a40"/>
    <polygon points="106.232450,0 53.116225,92 -53.116225,92 -106.232450,0 -53.116225,-92 53.116225,-92" fill="#d7cbb5"/>
    <polygon points="92.376043,0 46.188022,80 -46.188022,80 -92.376043,0 -46.188022,-80 46.188022,-80" fill="#347f7f"/>

    <!-- Approaches cut only through the outer sidewalk and exterior field. -->
    <g fill="#303a40" stroke="#f4ead9" stroke-width="0.7" vector-effect="non-scaling-stroke" mask="url(#outside-road)">
      <rect x="-310" y="-16" width="620" height="32" transform="rotate(30)"/>
      <rect x="-310" y="-16" width="620" height="32" transform="rotate(90)"/>
      <rect x="-310" y="-16" width="620" height="32" transform="rotate(150)"/>
    </g>

    <!-- Exact ring and curb boundaries. Strokes are annotation only, not physical width. -->
    <polygon class="boundary" points="92.376043,0 46.188022,80 -46.188022,80 -92.376043,0 -46.188022,-80 46.188022,-80"/>
    <polygon class="curb" points="106.232450,0 53.116225,92 -53.116225,92 -106.232450,0 -53.116225,-92 53.116225,-92"/>
    <polygon class="curb" points="143.182867,0 71.591433,124 -71.591433,124 -143.182867,0 -71.591433,-124 71.591433,-124"/>
    <polygon class="boundary" points="157.039273,0 78.519637,136 -78.519637,136 -157.039273,0 -78.519637,-136 78.519637,-136"/>

    <!-- Centerlines: H(108) splits the 32-stud road into two exact 16-stud halves. -->
    <polygon class="lane" points="124.707658,0 62.353829,108 -62.353829,108 -124.707658,0 -62.353829,-108 62.353829,-108"/>
    <g class="lane" mask="url(#outside-overall)">
      <line x1="-310" y1="0" x2="310" y2="0" transform="rotate(30)"/>
      <line x1="-310" y1="0" x2="310" y2="0" transform="rotate(90)"/>
      <line x1="-310" y1="0" x2="310" y2="0" transform="rotate(150)"/>
    </g>

    <!-- Six 12-stud-deep crosswalk zones across the outer sidewalk. -->
    <g fill="#f4f5ed" opacity="0.92">
      <use href="#crosswalk" transform="rotate(30)"/>
      <use href="#crosswalk" transform="rotate(90)"/>
      <use href="#crosswalk" transform="rotate(150)"/>
      <use href="#crosswalk" transform="rotate(210)"/>
      <use href="#crosswalk" transform="rotate(270)"/>
      <use href="#crosswalk" transform="rotate(330)"/>
    </g>

    <!-- World origin and axes. -->
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#ffffff" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#ffffff" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="0" cy="0" r="2.4" fill="#f5d77a"/>
  </g>

  <!-- A light grid overlay keeps the unit rhythm visible on every surface. -->
  <rect x="128" y="128" width="1792" height="1792" fill="url(#grid-minor)" opacity="0.2"/>
  <rect x="128" y="128" width="1792" height="1792" fill="url(#grid-major)" opacity="0.25"/>

  <!-- Plot border and coordinate ticks. -->
  <rect x="128" y="128" width="1792" height="1792" fill="none" stroke="#8dc3d1" stroke-width="3"/>
  <g class="tick">
    <path d="M128 1920v12 M352 1920v12 M576 1920v12 M800 1920v12 M1024 1920v12 M1248 1920v12 M1472 1920v12 M1696 1920v12 M1920 1920v12"/>
    <path d="M116 128h12 M116 352h12 M116 576h12 M116 800h12 M116 1024h12 M116 1248h12 M116 1472h12 M116 1696h12 M116 1920h12"/>
  </g>
  <g class="ui-text" fill="#a9cbd4" font-size="19" text-anchor="middle">
    <text x="128" y="1958">-256</text><text x="352" y="1958">-192</text><text x="576" y="1958">-128</text>
    <text x="800" y="1958">-64</text><text x="1024" y="1958">0</text><text x="1248" y="1958">64</text>
    <text x="1472" y="1958">128</text><text x="1696" y="1958">192</text><text x="1920" y="1958">256 X</text>
  </g>
  <g class="ui-text" fill="#a9cbd4" font-size="19" text-anchor="end" dominant-baseline="middle">
    <text x="105" y="128">-256</text><text x="105" y="352">-192</text><text x="105" y="576">-128</text>
    <text x="105" y="800">-64</text><text x="105" y="1024">0</text><text x="105" y="1248">64</text>
    <text x="105" y="1472">128</text><text x="105" y="1696">192</text><text x="105" y="1920">256 Z</text>
  </g>

  <!-- Exact dimension callouts. -->
  <g class="ui-text">
    <line class="dimension" x1="412" y1="548" x2="412" y2="1500" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)"/>
    <line class="dimension" x1="412" y1="548" x2="749" y2="548"/>
    <line class="dimension" x1="412" y1="1500" x2="749" y2="1500"/>
    <text x="376" y="1024" fill="#f5d77a" font-size="25" text-anchor="middle" transform="rotate(-90 376 1024)">272 STUDS — OVERALL FLAT-TO-FLAT</text>

    <line class="dimension" x1="1112" y1="702" x2="1112" y2="744" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)"/>
    <text x="1130" y="730" fill="#f5d77a" font-size="20">12</text>
    <line class="dimension" x1="1158" y1="590" x2="1158" y2="702" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)"/>
    <text x="1176" y="654" fill="#f5d77a" font-size="20">32</text>
    <line class="dimension" x1="1204" y1="548" x2="1204" y2="590" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)"/>
    <text x="1222" y="576" fill="#f5d77a" font-size="20">12</text>
  </g>

  <!-- Center labels. -->
  <g class="ui-text" text-anchor="middle">
    <text x="1024" y="988" fill="#eaf7f4" font-size="28" font-weight="700" letter-spacing="2">CIVIC / BUILDABLE CORE</text>
    <text x="1024" y="1027" fill="#d2edeb" font-size="24">160 STUDS FLAT-TO-FLAT</text>
    <text x="1024" y="1063" fill="#b8d9d7" font-size="19">184.752 STUDS POINT-TO-POINT</text>
    <text x="1050" y="1089" fill="#f5d77a" font-size="17" text-anchor="start">ORIGIN (0, 0)</text>
  </g>

  <!-- Legend. -->
  <g class="ui-text">
    <rect x="156" y="158" width="478" height="322" rx="14" fill="#07151e" fill-opacity="0.94" stroke="#477f91" stroke-width="2"/>
    <text x="184" y="198" fill="#f4f8fa" font-size="26" font-weight="700">MEASURED DRAFT</text>
    <text x="184" y="229" fill="#8dc3d1" font-size="18">PROPOSED DIMENSIONS — NOT A PRODUCTION ASSET</text>

    <rect x="184" y="254" width="27" height="20" fill="#347f7f"/><text x="228" y="271" fill="#e1eef0" font-size="20">Core: 160 studs across flats</text>
    <rect x="184" y="290" width="27" height="20" fill="#d7cbb5"/><text x="228" y="307" fill="#e1eef0" font-size="20">Sidewalks: 12 studs each</text>
    <rect x="184" y="326" width="27" height="20" fill="#303a40"/><text x="228" y="343" fill="#e1eef0" font-size="20">Roadway: 32 studs / 16 per lane</text>
    <line x1="184" y1="371" x2="211" y2="371" stroke="#f6f4e8" stroke-width="3" stroke-dasharray="8 6"/><text x="228" y="378" fill="#e1eef0" font-size="20">Dashed roadway centerline</text>
    <line x1="184" y1="407" x2="211" y2="407" stroke="#347088" stroke-width="2"/><text x="228" y="414" fill="#e1eef0" font-size="20">Minor grid 4 / major grid 16 studs</text>
    <text x="184" y="451" fill="#f5d77a" font-size="20" font-weight="700">1 MAP UNIT = 1 ROBLOX STUD</text>
  </g>

  <!-- Orientation and dimensional notes. -->
  <g class="ui-text">
    <rect x="1481" y="158" width="407" height="284" rx="14" fill="#07151e" fill-opacity="0.94" stroke="#477f91" stroke-width="2"/>
    <text x="1510" y="198" fill="#f4f8fa" font-size="24" font-weight="700">PLAN CONTRACT</text>
    <text x="1510" y="232" fill="#d8e7eb" font-size="19">View: 512 × 512 studs</text>
    <text x="1510" y="264" fill="#d8e7eb" font-size="19">Axes: X / Z (Y not shown)</text>
    <text x="1510" y="296" fill="#d8e7eb" font-size="19">Overall across points: 314.079</text>
    <text x="1510" y="328" fill="#d8e7eb" font-size="19">Approach roadway: 32</text>
    <text x="1510" y="360" fill="#d8e7eb" font-size="19">Approach sidewalks: 12 each side</text>
    <text x="1510" y="392" fill="#f5d77a" font-size="18">Paint and boundary strokes add 0 studs</text>

    <line x1="1838" y1="256" x2="1838" y2="205" stroke="#f4f8fa" stroke-width="4" marker-end="url(#north-arrow)"/>
    <text x="1838" y="286" fill="#f4f8fa" font-size="22" text-anchor="middle" font-weight="700">N</text>
    <text x="1838" y="310" fill="#9fc8d2" font-size="16" text-anchor="middle">−Z</text>
  </g>

  <!-- 64-stud scale bar in four 16-stud modules. -->
  <g class="ui-text">
    <text x="160" y="1792" fill="#e8f1f3" font-size="20" font-weight="700">SCALE BAR — STUDS</text>
    <rect x="160" y="1810" width="56" height="20" fill="#f4f8fa"/>
    <rect x="216" y="1810" width="56" height="20" fill="#183c4b"/>
    <rect x="272" y="1810" width="56" height="20" fill="#f4f8fa"/>
    <rect x="328" y="1810" width="56" height="20" fill="#183c4b"/>
    <rect x="160" y="1810" width="224" height="20" fill="none" stroke="#f4f8fa" stroke-width="2"/>
    <g fill="#d8e7eb" font-size="17" text-anchor="middle">
      <text x="160" y="1855">0</text><text x="216" y="1855">16</text><text x="272" y="1855">32</text><text x="328" y="1855">48</text><text x="384" y="1855">64</text>
    </g>
  </g>

  <g class="ui-text">
    <text x="128" y="74" fill="#f4f8fa" font-size="34" font-weight="750" letter-spacing="1.5">HEX CITY CENTER — ROBLOX UNIT GRID</text>
    <text x="128" y="106" fill="#8dc3d1" font-size="19">ORTHOGRAPHIC X–Z WHITEBOX PLAN • REV 01 • 2026-07-25</text>
    <text x="1024" y="2010" fill="#86afba" font-size="17" text-anchor="middle">TASK-LOCAL TEST ARTIFACT • NOT IMPORTED • NOT SAVED TO STUDIO • NOT PUBLISHED • NOT REGISTERED • NOT COMMITTED</text>
  </g>
</svg>
